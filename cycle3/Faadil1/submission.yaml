app_name: Stub
category: Pay
tagline: The rent book, on-chain. Every month's rent, with the stub to prove it.
description: Stub is a Nimiq Pay Mini App that helps landlords create
  wallet-signed rent requests, track monthly payments and reconcile NIM
  transactions with individual rental units. Tenants pay directly through Nimiq
  Pay and keep a printable, verifiable payment record.
