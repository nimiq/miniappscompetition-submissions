builder_story: "Stub started with a simple question: why is tracking monthly
  rent still so complicated for small landlords and tenants?\r

  \r

  We wanted to turn a wallet transfer into a more understandable recurring
  payment experience. By combining Nimiq Pay, signed rent requests and a
  traditional paper-inspired rent book, we built Stub to make rent easier to
  request, track and verify.\r

  \r

  Our goal is to demonstrate how blockchain payments can solve an everyday
  problem without requiring users to understand the underlying technology."
