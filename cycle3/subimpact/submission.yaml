builder_story: "I run an independent Nimiq validator, so I watch NIM move every
  day: rewards landing, stakes changing, payments going out. I entered NimBooks
  in Cycle 2 as the books for your Nimiq wallet. Since then I have rebuilt it
  around the question I ask most about my own NIM: what is it earning?\r

  \r

  The Earn card on Overview shows what your stake makes in a year, or what idle
  NIM could earn at the median pool's rate. The yield calculator projects 1, 3
  or 5 years for any pool, with compounding for restaking pools and Nimiq's
  falling issuance built in. You can stake straight from Nimiq Pay, even NIM
  that Pay is still moving while your wallet shows 0 to spend, or from Nimiq
  Wallet in any browser. Every staking reward back to January 2025 now appears
  in History, statements and tax.\r

  \r

  The books are still there when you need them: tax-year statements that keep
  staking income apart from real payments, FIFO tax in your own currency, and
  Koinly, CoinTracking and CryptoTaxCalculator CSVs.\r

  \r

  NimBooks never holds your keys. You approve every stake in Nimiq Pay or Nimiq
  Wallet. It is open source (MIT), and nimbooks-mcp gives AI assistants a
  read-only view of your books that can never sign."
