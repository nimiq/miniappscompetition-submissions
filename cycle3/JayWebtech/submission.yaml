builder_story: "If you hold crypto, you know the dance. You find a P2P trader,
  send first, refresh your bank app forty times, pray, and hope the alert lands
  before your data does. Holding NIM shouldn’t feel like a trust exercise just
  to buy jollof.\r

  \r

  So I built KhalkosPay: crypto that behaves like normal money. Tell it how much
  (out loud, if you like), approve once, and money lands in your bank. You can
  easily buy NIM tokens using your credit card\r

  \r

  And because money is for living, I added a pet that guilt-trips you into
  eating vegetables.\r

  \r

  The name? Khalkos is Greek for copper, one of the first metals people ever
  used as money. KhalkosPay is that idea for the NIM era: honest money that
  moves when you say so."
