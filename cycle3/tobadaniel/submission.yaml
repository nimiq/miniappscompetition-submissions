description: "Earnest is where gig work meets proof. Claim a job or post one,
  get paid wallet to wallet in NIM, and both sides sign the receipt. Receipts
  chain by hash into your Earn Passport: portable proof of earnings anyone can
  verify in a browser. Then stake what you earned, in one app."
