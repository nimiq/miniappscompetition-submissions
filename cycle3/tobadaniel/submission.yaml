builder_story: "A freelancer in Lagos finishes a job, gets paid, and a month
  later cannot prove any of it happened. No payslip, no contract, nothing a
  landlord, a bank or an embassy will accept. Platforms like Upwork hold your
  reputation hostage: five years of five-star work vanishes the day you leave. I
  built Earnest so the proof belongs to the worker.\r

  \r

  The loop is simple. A client posts a job with a NIM bounty and shares one
  link. A worker claims it, does the work, and gets paid wallet to wallet inside
  Nimiq Pay. Then both sides sign the receipt with their own wallets: the client
  signs that the work was accepted and paid, the worker countersigns that the
  money arrived. Neither signature can be added later by the other party.\r

  \r

  Every receipt then joins the worker's Earn Passport. Each receipt commits to
  the SHA-256 hash of the one before it, so the whole history forms one
  tamper-evident chain. Edit an amount, delete a bad job, reorder the past, and
  every later hash breaks. The passport travels as a single link; anyone who
  opens it can press verify and watch their own browser recompute the entire
  chain and check the total. No server, no account, no permission from
  Earnest.\r

  \r

  Earnings should not sit idle either. The Grow tab stakes NIM through Nimiq
  Pay's own staking transactions, the full create-staker and add-stake family,
  so money earned on a job in the morning can be working by the afternoon
  without leaving the app or opening an exchange account.\r

  \r

  Technically, Earnest uses more of the Mini App toolkit than a payment button:
  basic transactions for pay, message signing for the dual-signature receipt
  protocol, the staking transaction family for Grow, and host network and
  balance reads throughout. It is local-first by design: jobs and passports live
  in shareable links, and Earnest never holds anyone's money or keys.\r

  \r

  The honest limits: receipts prove that both parties signed the same statement,
  not that a job was done well; a dispute still needs humans. The roadmap is
  anchoring the passport's chain tip on-chain, optional HTLC escrow for
  high-value jobs, and a pool directory with payout history inside Grow. The gig
  economy runs on trust that workers cannot carry with them today. Earnest makes
  it portable."
