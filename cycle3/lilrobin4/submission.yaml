builder_story: "NimTera started with a simple goal: make accepting NIM useful
  for everyday shops, not just demonstrate a payment button.\r

  \r

  I wanted sellers to manage products, share a storefront, and follow orders
  through checkout and payment confirmation in one place. Customers should be
  able to browse and order without creating an account, on either PC or
  mobile.\r

  \r

  NimTera supports email/password sign-in in a browser and wallet sign-in inside
  Nimiq Pay. Sellers can explicitly link both methods to the same shop. Payments
  go directly to the merchant’s wallet—NimTera never holds customer funds.\r

  \r

  One key challenge was matching incoming payments without asking merchants to
  copy transaction hashes. NimTera adds a clearly displayed unique payment
  adjustment and checks incoming transactions automatically while the relevant
  page is open.\r

  \r

  I also focused on everyday usability: product photos, six interface languages,
  Day/Night themes, optional two-factor authentication, and cashier audio
  announcements.\r

  \r

  Version 1.0 runs on Nimiq Testnet. The demos show the actual desktop, mobile,
  and Nimiq Pay flows, including a confirmed Testnet payment. Mainnet support is
  planned for a future release after further testing and security review."
