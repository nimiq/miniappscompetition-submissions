builder_story: "Saving money often feels abstract and disconnected from our
  daily routines. Many people want to build solid reserves, yet traditional
  savings products lack emotional resonance and charge high transaction fees
  that punish frequent small deposits.\r

  \r

  We built Nimisave to transform disciplined saving into an exciting, visual
  habit. By combining voluntary hobby triggers with Nimiq micro settlements,
  users can automatically set aside funds whenever their favorite team wins a
  match or after a weekly hobby session. Each contribution immediately assembles
  another physical piece of their chosen 3D goal in real time, from modern dream
  houses to vehicles and travel funds.\r

  Nimiq makes this possible through zero gas fees, instant finality, and non
  custodial security. Users stay in full control of their keys while
  experiencing the satisfaction of watching their dreams take shape with every
  victory."
