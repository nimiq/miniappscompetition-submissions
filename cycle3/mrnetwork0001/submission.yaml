builder_story: "I live between Italy and Nigeria. Every month I watch the same
  thing happen: people hold crypto, but when the electricity token runs out back
  home, or someone needs airtime, they still have to find a bank, a middleman or
  a friend with naira. Nimiq Pay made paying with NIM easy, but it couldn't pay
  a bill, top up a phone or reach a bank account.\r

  \r

  Ponte is the bridge. It shows the meter owner's name before you pay and
  delivers the electricity token in seconds. It swaps NIM and USDT with no gas,
  and it lets people cash out to each other through an escrow on Polygon, where
  a buyer can take just the part they need.\r

  \r

  Every payment is verified onchain. In its first week on mainnet, Ponte handled
  about 140 real payments, and our quest campaign paid 15 testers 150,000 NIM in
  under 2 hours."
