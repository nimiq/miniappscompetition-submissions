builder_story: "I'm a final-year pharmacy student and self-taught developer in
  Nigeria. I built Hexgrove to make staking feel less like a spreadsheet and
  more like something you tend. I verified the real flows myself on a phone:
  create, add, stop earning and withdraw all ran on mainnet, the last on
  2026-11-11 after the 12 to 24 hour unstake wait, and the full cycle also ran
  on testnet. Since launch, Vercel Analytics (anonymous, no cookies, no wallet
  data) shows 9 visitors and 16 page views in the first day, a few of them
  from my own testing. The app is open source (MIT) and I plan to keep
  building it."
