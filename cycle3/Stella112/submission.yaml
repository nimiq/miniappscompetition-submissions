builder_story: "Across Nigeria and much of Africa, people save together in esusu
  and ajo groups: everyone contributes each meeting, members can borrow, and the
  pot is shared at the end. It works because people trust each other, but the
  records live in a notebook and the money sits idle in naira that loses value.
  Kittora puts that circle on-chain inside Nimiq Pay. Savings are in dollars
  that earn, every contribution, loan and approval is visible to the whole
  group, loans need guarantors and approvals, and at Share-Out everyone gets
  their savings plus the group's interest. Members never touch gas: they sign in
  Nimiq Pay and Kittora pays the fees. NIM holders can keep their NIM staked and
  back a savings promise with a bond. \"Save alone, grow together.\""
