builder_story: "StakeSafe started with a simple problem: it should be easy to
  understand a Nimiq staking position without confusing the account being
  monitored with the wallet that signs a transaction.\r

  \r

  The app combines an actual mainnet staking profile, a searchable validator
  directory, and reviewed native staking actions in Nimiq Pay. It separates
  active, inactive and retired funds, explains the staged unstaking process, and
  distinguishes a basic address balance from funds Pay may hold in HTLC
  contracts.\r

  \r

  I focused on transparent failure states, remembered read-only monitoring,
  exact transaction amounts, explicit owner checks, and safeguards against
  repeating a request with an unknown result. Keys stay in Pay; the app's server
  only forwards a small allowlist of mainnet read requests.\r

  \r

  The interface supports Light, Dark and System themes and mobile navigation.
  Automated tests cover the main UI and financial request guards with mocked
  hosts and RPC; they are not a substitute for physical-device verification. The
  public code is MIT licensed, with dependency attribution."
