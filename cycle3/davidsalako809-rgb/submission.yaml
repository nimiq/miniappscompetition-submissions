description: Stub let's anyone sell tickets in Nimiq Pay. Hosts create an event
  and share one link or poster. Guests pay in NIM or USDT straight to the host's
  wallet, and each ticket is a QR of the payment. At the door, Stub verifies it
  on-chain and admits the ticket once. No server, no fees!
