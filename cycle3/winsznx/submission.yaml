builder_story: "Tally started in Cycle I as a testnet experiment in automatic
  settlement, and it didn't win. Testing it with real groups showed the hard
  part was never the maths. It was trust: did my friend actually pay, and did I
  really agree to that amount? For Cycle III we rebuilt it around that. Every
  share needs the debtor's own signed agreement, every payment is approved in
  Nimiq Pay, and a payment only counts once Tally finds it on mainnet with the
  right recipient, amount and memo. We switched off the old auto-pay key because
  Nimiq Pay's co-signed spending account made it the wrong trade-off. The first
  real payments between two of our wallets confirmed in about a minute."
