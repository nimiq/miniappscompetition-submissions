app_name: Tally
category: Pay
tagline: Shared expenses. Actually settled.
description: Tally keeps one shared tab for groups who split costs. Each person
  agrees to their own share, and Tally turns what's owed into the fewest NIM
  payments, marking each one paid only once it's confirmed on the Nimiq network.
pricing: Free
