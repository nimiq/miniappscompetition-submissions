builder_story: "As a freelancer, getting paid across borders shouldn't be harder
  than doing the actual work. Between payment restrictions, currency
  conversions, and the complexity of international transfers, receiving money
  can be unnecessarily frustrating.\r

  \r

  We built Nimbill to make that easier. It lets freelancers and small businesses
  invoice in their local currency and receive payments in NIM or USDT, with
  on-chain verification. And we're thinking beyond payments: in future updates,
  you'll be able to stack your earnings and save them directly within Nimbill.
  The idea is simple: make getting paid globally as seamless as sending an
  invoice."
