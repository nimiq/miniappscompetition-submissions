builder_story: "PhoenixWire grew out of PhoenixMail, my email client. After
  integrating Nimiq Cashlinks into emails, I wondered: what if a payment link
  could be protected so that forwarding it wasn’t enough to claim the money?\r

  \r

  That question became PhoenixWire: payment cards for NIM, USDC and USDT,
  protected by a verification code sent to the recipient’s email. It also
  supports sending and receiving NIM directly through Nimiq Pay or Nimiq
  Wallet.\r

  \r

  My goal is to make crypto easier to discover and use, especially for people
  who have never tried it. Sending someone their first NIM should feel as
  familiar as sending them an email. What started as a small feature became a
  project of its own—and perhaps a slightly crazy idea worth pursuing!"
