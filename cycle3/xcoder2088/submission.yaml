app_name: PhoenixWire
category: Pay
tagline: Email connects people. Wire aims to connect their payments.
description: PhoenixWire lets you send NIM, USDC and USDT by email as payment
  cards protected by an email verification code, so only the intended recipient
  can claim them. Built for everyday users, it supports sending and receiving
  NIM directly through Nimiq Pay or Nimiq Wallet.
