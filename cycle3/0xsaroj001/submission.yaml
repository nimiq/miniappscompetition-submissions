builder_story: A star rating is easy to leave, but the details that help the
  next guest take time to write. NimReview gives venues a way to reward that
  effort. A single-use bill code connects a review to a visit, and a critical
  review can earn just as much as a glowing one. Guests can ask the venue to pay
  what they’ve earned, and the venue sends NIM directly to the guest’s wallet.
