tagline: Prove you went. Earn NIM for an honest review.
description: NimReview helps guests at restaurants, cafés, and hotels earn NIM
  for useful reviews after verifying a visit with a single-use bill code. Guests
  and owners sign in with Nimiq Pay, and owners pay cash-out requests directly
  from their own wallets.
