builder_story: "Pigeon: pay anyone on Nimiq by name.\r

  \r

  The problem: a Nimiq address is 36 characters. Nobody remembers one, people
  copy it from chats, and a swapped address is easy to miss. Paying a friend
  back for coffee should be as easy as saying their name.\r

  \r

  What it does: in Pigeon, money is a letter. You write mert.nim, the amount and
  a note, seal it, and the pigeon flies to the right address. You can also tie a
  note to the pigeon's leg (a payment request link) and it flies back to you
  when the other person pays. For a dinner bill, the letter is torn into stamps,
  one per friend, and each stamp gets a postmark when that friend pays.\r

  \r

  How .nim names work without contracts: Nimiq has no smart contracts, so the
  registry is a set of public rules applied to ordinary transactions. A payment
  to the registry address with the note \"nim:<name>\" that pays at least the
  name's price registers it; the earliest valid payment on chain wins. Anyone
  can rebuild the same table from the chain. Requests work the same way: the
  payer's wallet sends the note \"ode:<id>\", and the server sees the payment on
  chain by itself. Nobody reports a payment, and the server cannot invent one.\r

  \r

  Safety: the app never holds keys or money; every payment is confirmed in Nimiq
  Pay. Every person is shown with their Nimiq Identicon, so a lookalike name
  stands out. If a request link claims to come from mert.nim but the money would
  go elsewhere, Pigeon blocks it and shows both pigeons side by side. Notes are
  public on chain and the app says so before you send.\r

  \r

  How it uses Nimiq Pay: Pigeon asks the wallet for the user's address and opens
  straight into their balance and incoming payments. Sending, paying a request
  and registering a name all go through the wallet's own confirmation, with zero
  fee.\r

  \r

  Built with: the official @nimiq/core light client on the server (reading
  mainnet), @nimiq/identicons, and plain HTML, CSS and JavaScript in the app. It
  follows the phone language (English or Turkish) and the light or dark theme.\r

  \r

  What comes next: profiles on names, transfer and sale of names, subnames such
  as shop.mert.nim, commit and reveal registration with refunds, merchant QR
  codes, a shared community jar, and a small library so any Nimiq app can
  resolve .nim names. The roadmap is in the README.\r

  \r

  Live: https://pigeon.heylogram.com\r

  Code: https://github.com/jakalijey/pigeon (MIT)"
