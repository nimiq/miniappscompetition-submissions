builder_story: "I built Thence because something about crypto payments has
  always bothered me: why should paying someone become complicated just because
  we use different blockchains?\r

  \r

  Imagine holding NIM and wanting to pay someone who prefers USDC on Polygon.
  Suddenly, a simple payment becomes a process involving swaps, bridges,
  multiple wallets, and different networks.\r

  \r

  I wanted to remove that friction.\r

  \r

  So I built Thence, a cross-chain payment mini app for Nimiq Pay that allows
  users to pay with NIM while recipients receive supported assets on another
  blockchain.\r

  \r

  Getting it to work with real funds took several iterations. I had to work
  through payment confirmation delays, settlement verification, and
  delivery-state issues.\r

  \r

  But eventually, I completed real NIM-to-USDC payments on mainnet and verified
  that the funds arrived on Polygon.\r

  \r

  That was the moment Thence went from an idea to something genuinely useful.\r

  \r

  USDC on Polygon is our first live destination, but my bigger vision is to make
  NIM useful for payments across more blockchain ecosystems.\r

  \r

  Your NIM can go further."
