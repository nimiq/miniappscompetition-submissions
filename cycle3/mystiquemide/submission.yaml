builder_story: Money in a wallet is always one tap from being spent. Savings
  apps fix that by holding your money for you, so you have to trust them not to
  freeze it, lose it or move it. I wanted the lock without the trust. Sevu's
  contract has no owner and no admin functions at all, so the only thing that
  can open an envelope is its date. Gasless permits made it work for Nimiq Pay
  users who hold USDT but no POL. The first lock went in on 1 Nov from my phone
  with zero POL, the contract refused my own early withdrawal, and on 8 Nov it
  paid the full amount back. Both transactions are on Polygonscan.
