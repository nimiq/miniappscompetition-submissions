builder_story: "Validator Swipe is back for Cycle III, rebuilt around what the
  staking protocol really requires. In September two of our flows (Retire,
  Switch) sent requests the protocol refuses, and we wrongly blamed Nimiq Pay;
  we corrected that publicly in 1.1.3. To make the app work for real we read the
  Nimiq Pay source code to understand how a Mini App's staking transactions
  leave the wallet, and adjusted our own Nimiq infrastructure (our two nodes and
  the validator dashboard API that feeds the app). Stake, add stake and unstake
  are verified on mainnet. Finish unstaking, Claim and Switch are implemented as
  the protocol requires and still have to be validated on-chain: our test
  unstake unlocks on Nov 12. One change is still needed on the Nimiq Pay side:
  when everything is staked, Nimiq Pay cannot send the unstake signals, because
  it sends them from its swap contract. Until then the app keeps a 5 NIM
  reserve. We have documented the fix and will propose it to the Nimiq Pay team
  as an issue and a pull request; the app already detects it (getCapabilities)
  and will then drop the reserve on its own. Our goal is to contribute that
  change so every staking step works from any Nimiq Pay wallet."
