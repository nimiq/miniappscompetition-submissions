builder_story: "AbaPay turns NIM into real-world utility inside Nimiq Pay.\r

  \r

  Most people hold NIM but still struggle to spend it on everyday needs. AbaPay
  solves that by letting users pay for airtime, mobile data, electricity, cable
  TV, education PINs, and local bank transfers directly with NIM — all from a
  Mini App that runs inside Nimiq Pay.\r

  \r

  We built this after months of shipping real bill-payment infrastructure on
  Celo, where AbaPay has processed thousands of live utility payments and
  received recognition including a Prezenti Frontier grant and first place at
  the Celo Agents at Work hackathon. That work proved people want crypto they
  can actually use for real life, not just trade.\r

  On Nimiq Pay, the experience is simple and non-custodial. Users connect their
  wallet through the Mini App SDK, see a live NIM quote based on market rates,
  confirm the payment, and the bill is delivered. No seed phrases are entered
  into the app, and no funds are held by AbaPay.\r

  \r

  AbaPay is for anyone in the Nimiq community who wants their NIM to pay for
  something useful today — topping up a phone, keeping the lights on, or sending
  money to a local bank account — without leaving Nimiq Pay.\r

  By bringing proven real-world payment rails into the Nimiq ecosystem, we give
  NIM holders a practical reason to use and hold the token. This is utility that
  works on the first try."
