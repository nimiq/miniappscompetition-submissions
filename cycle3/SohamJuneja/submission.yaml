builder_story: "Every savings app I've tried fails the same way: it asks me to
  remember to save. Goal jars, savings circles, piggy banks all depend on a
  manual deposit, and manual deposits are the first habit to go. Round-ups fixed
  this for millions of people in traditional banking: you don't decide to save,
  your spending does it for you. Nobody had built that for Nimiq Pay, so I
  did.\r

  \r

  Spare reads the payments you've already made, rounds each one up and lets you
  sweep the total into your own NIM stake with one approval. Spare holds nothing
  and has no backend. Every sweep is a staking transaction you sign in Nimiq
  Pay, and the money stays in your wallet, earning.\r

  \r

  The hard part was finding the spending at all. Nimiq Pay doesn't pay from your
  wallet address. It pays from an HTLC vault that it replaces roughly every
  week, so a naive history read shows zero spending. Spare decodes each vault's
  creation data to rebuild the chain of vaults that belong to you, and separates
  real payments from internal moves, refunds and staking. It also tells
  Lightning swap HTLCs apart from vaults: both name your wallet as sender, so
  the hash lock and the swap hub decide. I checked the decoder against live
  account state and wrote fixture-backed tests for every case.\r

  \r

  Round-ups had to fit NIM. A 10 NIM payment is a fraction of a cent, so
  rounding to the next dollar would save more than you spent. Spare sizes the
  rounding step to each payment and caps every round-up at half the payment, so
  savings stay believable in USD, EUR, CRC or GMD.\r

  \r

  For the sweep I verified the staking rules against the chain and node source.
  The wallet, not the vault, is the staker. A first stake needs 100 NIM, after
  which any amount can be added. When the outcome of a sweep is unknown, Spare
  checks the chain before it will ever ask again, so it can't double-save. It
  defaults to a pool that actually pays its stakers, skipping the top-ranked one
  that doesn't.\r

  \r

  Testing: I ran two real sweeps on testnet inside Nimiq Pay, a new stake and
  then an add-to-stake, and the staker balance matches to the luna. Both
  transactions are linked in the app and the README. The app works in English
  and Spanish, in light and dark mode, with a read-only sample wallet so anyone
  can see it working in seconds.\r

  \r

  Honest limits are in the app too: on-chain, a Lightning purchase looks the
  same as a swap, so you can mark any item \"Not a purchase\".\r

  \r

  Next: USDT round-ups on Polygon, a weekly \"your spare change is waiting\"
  moment, and savings squads."
