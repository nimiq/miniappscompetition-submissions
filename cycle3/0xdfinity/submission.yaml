builder_story: "I kept abandoning carts because comparing a dozen merchants is
  exhausting, and crypto checkout made it worse, not better. I wanted the
  opposite: an agent that does the shopping and only asks you for one thing, one
  approval. Nimiq Pay's mini app SDK was the first place that flow could
  actually work end to end, so I built it. Every payment is verified against
  Nimiq mainnet RPC before the order shows as paid, because a shopping agent has
  to be honest or it's useless\r

  \r

  Ps: skool isn't available in my region, so I use linkdln instead"
