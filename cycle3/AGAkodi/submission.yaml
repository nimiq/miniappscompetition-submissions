builder_story: "The idea for Shelf came from an experience. I needed to read a
  particular book, but getting a copy required paying the full purchase price,
  which I couldn't readily afford at the time. So it came to me what if people
  could rent digital books for a cut of the full cost and access them for only
  as long as they needed?\r

  \r

  That idea became Shelf, a digital book rental platform designed to make
  reading more affordable and accessible. Beyond helping readers, Shelf also
  gives authors and publishers a place to launch their books, reach new
  audiences, and earn a commission whenever someone borrows their work. The goal
  is simple: make books easier to access while creating another way for authors
  to earn from their content."
