builder_story: "In rural India, women’s self-help groups pool small savings and
  lend from that fund when a member needs help. India’s Ministry of Rural
  Development launched the National Rural Livelihoods Mission in June 2011, now
  known as Deendayal Antyodaya Yojana–National Rural Livelihoods Mission
  (DAY-NRLM). By January 2025, the ministry reported 90.9 lakh self-help groups
  across the country.\r

  \r

  Picture a member whose sewing machine breaks. Her group can lend her money for
  the repair and agree on when she’ll repay it. I built Digital Samiti around
  that workflow so every member can see who contributed, how the group voted,
  and when the next instalment is due. The guest demo lets anyone try it with
  simulated NIM."
