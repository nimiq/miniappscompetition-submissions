builder_story: "Giftlink is gifting for Nimiq Pay, because the easiest way to
  get someone into NIM is to hand them some.\r

  \r

  Nimiq already had cashlinks in the web wallet. I wanted them inside Nimiq Pay,
  with the things people actually do with gifts: birthdays, a thank-you, a group
  present, a stack of vouchers at a meetup.\r

  \r

  How it works: one payment moves the NIM to a fresh address made for that gift.
  The key to that address lives only in the link, so Giftlink never holds
  anyone's money and there is no server to trust. When your friend taps Claim,
  their phone signs the transfer and the Nimiq chain confirms it about a second
  later. Links use the same format as Nimiq Hub cashlinks, so they also open in
  the web wallet.\r

  \r

  What I added beyond cashlinks:\r

  - Group gifts: a chip-in link lets friends add NIM to the same gift, and
  everyone sees who's in, read from the chain.\r

  - Voucher sheets: one payment becomes up to 25 QR vouchers to print or share
  at a meetup.\r

  - Take back: your sent gifts are rebuilt from the chain from one wallet
  signature, on any phone, so unclaimed gifts come back to you.\r

  - Claim into staking: if you already stake, a gift joins your stake in one
  step.\r

  - A secret-word lock for gifts posted in group chats (Giftlink suggests four
  random words), and a thank-you note the recipient can send back on chain.\r

  - A public stats page that counts claims from on-chain markers, so anyone can
  check real use.\r

  \r

  The code is MIT licensed, with unit tests and a testnet end-to-end script."
