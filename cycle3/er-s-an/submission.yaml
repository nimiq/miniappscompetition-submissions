builder_story: "License: MIT\r

  Team: Solo · Caesar (Jiachen Xie) · GitHub er-s-an\r

  \r

  One-liner: Split a restaurant or bar tab; friends settle shares to the host
  with NIM (Nimiq Pay SDK) or Polygon USDT via the injected wallet.\r

  \r

  How it works: Create a tab (venue, tip, tax), add people and line items,
  assign items, host connects wallet, each payer settles remaining balance.
  Inside Nimiq Pay: real `@nimiq/mini-app-sdk` NIM transfers + `window.ethereum`
  Polygon USDT ERC-20 transfer. Outside host: clearly labeled browser demo mode
  with simulated hashes. No backend, no custody — localStorage + share URL.\r

  \r

  Honesty: Real NIM/USDT only when opened in Nimiq Pay with providers;
  standalone browser is demo mode.\r

  \r

  Demo: https://tabsplit-psi.vercel.app\r

  Mini App path: https://tabsplit-psi.vercel.app/app"
