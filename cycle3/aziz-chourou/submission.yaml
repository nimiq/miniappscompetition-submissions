tagline: Call dibs. Save up. It's yours.
description: Dibs is a Mini App in Nimiq Pay that helps you save for gift cards.
  Choose Steam, Amazon, Netflix, Apple or 17 other brands, put aside NIM every
  week, and redeem your card with one tap once you hit your goal. Your savings
  earn rewards along the way.
