builder_story: "I built Rewind in Cycle II, and the question I kept coming back
  to afterwards was simple: once someone has NIM in Nimiq Pay, where can it go?
  Most things online are priced in dollars and accept USDC. NIM holders had no
  short path there from inside the wallet.\r

  \r

  DollarDoor is that path. You enter how much USDC or USDT you want and paste a
  Polygon address. The app fetches a live quote from LendaSwap, creates a
  Lightning-to-EVM swap, and hands the invoice to Nimiq Pay with
  payLightningInvoice. Nimiq Pay converts NIM to Lightning and shows the exact
  NIM amount before you approve. The stablecoin is then claimed gasless to your
  address. The app never holds funds. It has no backend, no account and no
  analytics; swap keys and history stay on the phone.\r

  \r

  The part I care about most is Exit Links. Anyone who accepts USDC, such as a
  freelancer, a shop or another app, can make a link with their address and an
  amount. A NIM holder opens it in Nimiq Pay with the fields filled in and
  locked, and pays in NIM. That turns every USDC address into a place NIM can be
  spent, which is the reason I think this helps Nimiq and not just one user.\r

  \r

  Two things I learned while building. The older LendaSwap SDK pointed at an API
  host that no longer answers, so I moved to the current pure TypeScript SDK,
  which also removed WASM from the app. And every number on screen comes from
  the live quote: fee, minimum, maximum and invoice amount. Nothing is
  hardcoded. On 11 November a quote for 10 USDC was a 13,585 sat invoice with a
  0.50 % swap fee.\r

  \r

  Status, stated plainly: quotes, invoice creation, Exit Links and the full
  interface are live. I have not yet completed a mainnet swap through the app
  end to end, because I had no NIM at the deadline. The app includes a demo mode
  that uses a live quote and a simulated payment, and it is labelled as
  simulated everywhere.\r

  \r

  Next: a first mainnet swap with the evidence in the README, optional wallet
  sign-in, and more destinations."
