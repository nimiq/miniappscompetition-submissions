builder_story: "In Ghana, the cedi has lost roughly a third of its value against
  the dollar in some recent years, so saving in cedis means watching your money
  shrink. People who can save in dollars do, but the tools are either banks with
  high minimums or crypto apps that assume you hold gas tokens and read
  everything in USD.\r

  \r

  CediNest is the susu card I wished existed. You keep USDT in your own Nimiq
  Pay wallet, put it to work in Aave on Polygon, and the app shows every
  balance, goal, and gain in cedis, the unit people actually plan in. The stamp
  card comes straight from the paper cards susu collectors use: one stamp per
  saving, a full card at the end of the month.\r

  \r

  The technical knot was gas. Nimiq Pay users hold NIM and USDT, not POL, so
  CediNest charges a tiny NIM fee and a relayer pays the Polygon gas, using an
  EIP-2612 permit so the money only ever moves between the user's wallet and
  their own Aave position. The relay contract is about 70 lines, holds nothing,
  and cannot take funds."
