builder_story: "Across Cameroon, money moves through MTN MoMo and Orange Money,
  not banks. Someone who earns or receives NIM has no simple way to turn it into
  francs they can spend at the market, and someone with francs has no simple way
  to get NIM.\r

  \r

  NimCFA puts that swap inside Nimiq Pay. To cash out, you type the FCFA you
  want and your MoMo or Orange number. The operator is detected from the prefix,
  and the rate is locked for 10 minutes. One approval in Nimiq Pay sends NIM to
  escrow with the order memo. The order engine checks the sender, memo, amount
  and network on-chain, then pays out to mobile money. To top up, you approve a
  USSD prompt on your phone, and NIM arrives in your Nimiq Pay wallet.\r

  \r

  Nobody should lose money to a failed transfer. If the operator rejects a
  payout, the NIM goes straight back. A late, short or wrong-wallet deposit is
  refunded too. An unknown payout result goes to manual review instead of being
  retried, so nobody is paid twice. Phone numbers are masked, and the app never
  sees a private key.\r

  \r

  The app uses the Nimiq Pay mini app SDK for accounts, balance and sending with
  a memo, and follows the host's language (French or English) and network. Today
  it runs on Nimiq testnet with a mobile money simulator. Next come a Fapshi or
  CamPay sandbox, testers in Cameroon, USDT cash-out and a network of local
  agents."
