builder_story: "Most Web3 skill games and leaderboards still trust the client.
  Players can easily cheat by modifying scores or replaying runs, which destroys
  competition and rewards.I built OPERATOR because I wanted skill challenges
  where the score is actually proven — not just claimed.  Nimiq gives every
  player a portable cryptographic identity without passwords or seed phrases in
  the app. The server issues a unique seed and run ID, the player only sends
  input events, and the server replays everything to calculate a verified
  score.  The result is simple: don’t just play. Prove it"
