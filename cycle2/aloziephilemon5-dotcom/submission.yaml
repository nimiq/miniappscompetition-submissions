builder_story: "I kept seeing the same problem: someone wants to get paid in
  NIM, so they paste a long wallet address into chat and hope the other person
  sends the right amount.\r

  \r

  That is easy to mess up. The payer has no memo, no amount, and no simple “open
  this and pay” step.\r

  \r

  I built NIM Invoice for freelancers, friends, and small sellers who need a
  clear payment request. You enter an amount and a short memo, copy the link,
  and send it. The payer opens it in Nimiq Pay and sends NIM to the address on
  the invoice. You can mark it paid after.\r

  \r

  I shipped a small working Mini App instead of a big unfinished one. The first
  version stores invoices on the device and puts the payment details in the
  shared link. Next I want payment confirmation and a cleaner share flow."
