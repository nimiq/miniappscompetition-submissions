builder_story: "Every time I tried to send crypto to a friend, the conversation
  started the same way: \"what's your wallet address?\" Then a long string gets
  pasted around, someone copies it wrong, or the friend doesn't have a wallet
  yet and the whole thing dies there.\r

  \r

  The fix is obvious once you see it: send a link instead of an address, and let
  whoever opens it claim the money. I wanted that for NIM inside Nimiq Pay, and
  Nimiq is a natural fit for it: transactions are free, so the link never needs
  gas, and the browser-native light client means the recipient's phone can sign
  and broadcast the sweep itself with no backend in between.\r

  \r

  KashLink generates a throwaway key pair, puts the private key in the link's
  URL fragment (which is never sent to any server), and funds it with a single
  Nimiq Pay approval. The claim screen sweeps the balance to the recipient's
  wallet; Revert sweeps it back to yours. Links use the same encoding as the
  Nimiq Hub, so even someone without Nimiq Pay can claim.\r

  \r

  The goal is simple: make sending NIM as easy as sending a meme. Build a link,
  drop it in a chat, done."
