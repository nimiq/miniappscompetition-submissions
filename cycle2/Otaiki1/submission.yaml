app_name: KashLink
category: Social
tagline: Send NIM to anyone with a link — no wallet address needed.
description: KashLink is a Cash Link mini app for Nimiq Pay. Pick an amount,
  approve once, and get a link you can share on WhatsApp, Telegram, SMS or
  anywhere. Whoever opens it taps Claim and the NIM lands in their wallet — zero
  fees, no sign-up. Unclaimed? Revert it back to your wallet easy.
