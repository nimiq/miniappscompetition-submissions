builder_story: "I build on Nimiq because the wallet flow makes a small app feel
  like a game instead of a bank. NimPulse started as a question between friends:
  will BTC close higher today? Making that a 1v1 duel with real wallet
  signatures felt like the right use of Nimiq Pay. \r

  \r

  The pick is probably yours, the opponent's is probably theirs, and the market
  settles it. The hard part was making resolution honest: both prices for a
  question come from the same source, ties count as NO, and if every price
  source fails the question retries instead of guessing. Next I want the duel to
  carry a real NIM stake, winner\r

  takes the pot. The data model is already shaped for it."
