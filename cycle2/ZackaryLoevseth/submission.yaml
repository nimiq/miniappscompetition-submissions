builder_story: "Borrowing something usually begins with a friendly conversation.
  The uncertainty arrives later: which accessories came with it, whether that
  scuff was already there, and when it was coming back.\r

  \r

  Handback brings those small details together. The idea is deliberately narrow:
  one item, one checklist, two people and a return date. Nimiq Pay gives each
  person a way to acknowledge the same record using a wallet they control,
  without creating another platform account or paying a transaction fee.\r

  \r

  The implementation uses AI coding assistance. It keeps the record portable,
  verifies signatures locally and makes limits visible. A wallet signature is
  evidence of acknowledgement; it is not an inspection, an identity service or
  proof that an item was physically returned.\r

  \r

  The app is designed for repeat use: share a tool, update both copies, then
  create a linked condition record when it comes back. Future work can be guided
  by real community feedback, especially phone sharing ergonomics and clearer
  cross-device handoffs.\r

  \r

  Validation status: the user completed the sample Save & review workflow on a
  phone. Native Nimiq Pay account connection, cancellation, real
  message-signature approval and a displayed Verified status remain unconfirmed.
  The video shows the public unsigned workflow with genuine screenshots and
  synthetic narration. It does not prove successful native wallet integration."
