builder_story: "NIM Relay started with one question: what if the transaction
  itself was the game mechanic?\r

  \r

  Instead of adding crypto rewards to a normal game, we made a real NIM transfer
  the baton. Each runner receives it, races the previous runner’s verified
  ghost, completes their leg, and passes it to the next person through Nimiq
  Pay.\r

  \r

  As the baton moves, it builds a visible journey across the Relay Atlas. Every
  verified handoff adds another runner, route and piece of history.\r

  \r

  We built the rest of the product around that idea: social challenges, verified
  ghosts, relay history, progression and a world that changes as people keep the
  baton moving.\r

  \r

  The goal is simple: make using NIM feel like play rather than payment
  infrastructure."
