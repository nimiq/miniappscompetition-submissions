builder_story: "Merchant payments usually end at the transfer. I wanted to make
  a NIM payment useful after checkout without turning it into a custodial
  payment platform or a generic\r

  loyalty app. NimPurchase lets a merchant create a checkout, receive NIM
  directly, and give the customer a verified Purchase Passport containing their
  receipt, loyalty progress, and a route back to merchant support.\r

  \r

  Nimiq is essential: the customer approves a real direct NIM transfer in Nimiq
  Pay, and NimPurchase independently verifies the transaction before activating
  the Passport. The app never holds customer funds, private keys, or seed
  phrases."
