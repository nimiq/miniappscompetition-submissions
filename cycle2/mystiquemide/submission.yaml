builder_story: "Community auctions are incredibly easy to start in a group
  chat,but once real people begin bidding, everything becomes harder: who bid
  first, whether the deadline was fair, what happens when someone withdraws, who
  actually won, and whether the winner really paid.\r

  \r

  I built Nimgavel to turn that messy process into one live, authoritative
  auction room powered by Nimiq Pay. I wanted the wallet to be part of the
  product from beginning to end, not something added only at checkout. Hosts
  sign to create and control auctions, bidders receive pseudonymous paddles and
  authorise their wallets, bids are checked against live NIM balances, and
  winners settle directly with hosts through Nimiq Pay.\r

  \r

  During Cycle II I kept putting Nimgavel in front of real mobile users and
  rebuilding the weak parts they found, including wallet detection, balance
  checks, mobile navigation, auction previews, loading states and fulfilment
  terms. \r

  \r

  By submission, we had completed real two-device mainnet auctions and verified
  multiple NIM settlements on-chain."
