builder_story: "Most wallets are transactional, you open them to send, receive,
  swap or check a balance, then leave. I wanted to test the opposite idea: could
  Nimiq Pay become somewhere people return to because it is fun?\r

  \r

  That became NimHunt. Players get three daily expeditions, choose a visible
  skill mission, explore Angkor Ruins, solve puzzles and survive hazards. Nimiq
  is not bolted on: the wallet authorizes the expedition, the server
  independently replays the actions instead of trusting the browser, and another
  wallet signature seals an eligible NIM reward. Treasure Bank records secured
  and delivered rewards, while daily missions, streaks and the Hall of Heroes
  give players reasons to return.\r

  \r

  I built it for existing Nimiq users, casual players and people who might enjoy
  the game before they ever need to think about the blockchain underneath it."
