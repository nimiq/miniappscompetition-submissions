builder_story: "I've split bills with roommates and friends more times than I
  can count, and it's always the same pattern: someone fronts the money,
  everyone agrees to pay their share, and then it just... doesn't happen. Not
  because anyone's dishonest, just because paying means leaving whatever app
  you're already in, remembering to do it, and someone else remembering to
  check.\r

  \r

  Before building anything, I dug into what people actually complain about, not
  what I assumed the problem was. Threads across r/venmo, r/roommates, and
  r/AmItheAsshole all pointed at the same thing: the tracking tools exist, but
  nothing actually closes the loop. You can log who owes what all day; it
  doesn't move a single coin.\r

  \r

  Payback collapses the request and the payment into one step. A requester
  generates a frozen, split request and shares one link. Each person taps Pay
  and approves inside Nimiq Pay's native wallet dialog, no separate app, no
  manual \"did they actually send it\" guessing. The requester's dashboard only
  ever shows \"paid\" once a payment is genuinely confirmed on-chain, not a
  self-reported checkbox.\r

  \r

  Being fully transparent: I ran out of runway to get a funded wallet in time to
  record a fully confirmed on-chain payment before submitting. Everything up to
  that final step is built and tested on a real device, request creation, the
  native approval dialog appearing, retry and failure handling, and the
  confirmation logic verified against Nimiq's live RPC. The one thing I couldn't
  finish in time was funding a wallet to record that last click. I'd rather say
  that plainly than fake it."
