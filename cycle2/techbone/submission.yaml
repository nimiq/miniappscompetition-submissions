builder_story: "My grandmother ran an ajo for twenty years. Ten women, a fixed
  contribution every week, one person takes the pot, then it rotates until
  everyone's had a turn. It always worked, the people, the trust, the rhythm,
  right up until it didn't, because it all rested on whoever was holding the
  money that month. One bad month and everyone's savings were just gone.\r

  \r

  I've watched that same story play out in every version of this,  ajo, esusu,
  susu, tanda, chit, whatever your family calls it. Hundreds of millions of
  people run these circles because they work. And they all carry the same single
  point of failure: a person.\r

  \r

  Ajo keeps everything that makes the original work, the rotation, the trust
  between people who already know each other, the discipline of a fixed
  contribution and removes the one part that breaks it. Nobody collects the
  money. Members pay each other directly, and the app's only job is to track
  who's paid and prove it on-chain.\r

  \r

  \r

  \r

  I built and tested this with real people putting in real money, not just test
  wallets, my brother was the first person to pay into a circle from his own
  phone while I watched my screen update with nothing in my hands. Someone in
  the Nimiq community caught a real flaw in the rotation logic during testing,
  and it shipped a fix within a day. That's the whole point: build something
  people can actually trust with their savings, not just a demo."
