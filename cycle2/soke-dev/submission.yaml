builder_story: "Google Maps can't tell me whether the filling station on Awolowo
  Road has fuel today, or whether Boundary Road is flooded this morning. That
  information isn't written down anywhere  and by the time it is, it's wrong.\r

  \r

  But somebody walked past that filling station ten minutes ago. The knowledge
  already exists; it just has no way of reaching the person who needs it, and no
  reason to travel.\r

  \r

  Confam gives it both. You ask about a place, put a small bounty on it, and
  somebody nearby walks over and photographs it. In a city where a wasted trip
  across town costs you an afternoon and the fuel to get there, knowing before
  you go is worth far more than the bounty.\r

  \r

  I built it inside Nimiq Pay because the escrow was never the hard part. Asking
  somebody to install an app, make an account and fund a wallet before they
  could earn for a two-minute walk that was. In a mini app, the wallet is
  already in their hand."
