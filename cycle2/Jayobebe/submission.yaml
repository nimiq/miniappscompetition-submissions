app_name: Blacktop
category: Social
tagline: Made by a rider, backed by riders
description: Blacktop is a privacy-first solo/ group ride companion app with
  real riders logging real rides. Pay Up is its built-in wallet feature along
  with Blacktank, a shared crew fuel pot that only pays out on unanimous vote,
  plus instant QR tips in NIM or USDT with zero fees to us.
