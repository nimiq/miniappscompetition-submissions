builder_story: I'm a marine engineer who rides motorcycles. Blacktop started
  because every ride app I tried wanted my data and money more than it wanted to
  help me track rides. Built solo between stretches of sea time, it grew from a
  simple ride tracker into convoy comms, live maps, safety tools, and a whole
  trading-card and badge economy, shaped by feedback from actual riders using
  it. I cold-pitched it at a local motorcycle shop's open day with zero ad
  spend, and it's grown past 200 riders since, word of mouth, not budget.
