builder_story: I built MergeEarn to make open-source bounties verifiable end to
  end. GitHub is the source of truth for the work, while Nimiq is the source of
  truth for the money. Maintainers can fund real GitHub issues with NIM,
  contributors submit real pull requests, and payment is released only after the
  expected merge is verified. The goal is to remove screenshots, manual status
  updates, and payout spreadsheets from small open-source contributions.
