builder_story: "FixEstimate Pay grew out of a problem I kept seeing while
  building the larger FixEstimate AI product: when something breaks at home,
  people need a clear next step immediately. They do not necessarily want
  another account or subscription. They want to know whether the situation is
  dangerous, what the repair may cost, what supplies could be involved, and
  whether they should attempt it or call a professional.\r

  \r

  Nimiq Pay made a focused pay-per-report experience possible. The most
  important engineering challenge was making the wallet integration a real part
  of the product instead of a decorative connection. Each report receives a
  unique request reference, the user approves a clearly disclosed 0.1 NIM
  transaction in Nimiq Pay, and the backend verifies the sender, recipient,
  value, embedded reference and network confirmation before the AI report is
  generated. If confirmation is delayed, the user can retry the same report
  without paying again.\r

  \r

  Safety and privacy shaped the build just as much as the payment flow.
  Electrical and gas requests are always professional-only. Other serious
  hazards trigger conservative stop conditions. Optional photos are compressed
  on-device, only a three-digit ZIP prefix is used for regional pricing, and
  private keys never leave Nimiq Pay.\r

  \r

  I built FixEstimate Pay as a standalone, mobile-first, open-source Phōstēr
  Labs app using React, TypeScript, Firebase, Gemini and the Nimiq Pay Mini Apps
  Framework. My goal was not a crypto demo, but a practical tool where NIM
  unlocks immediate everyday value."
