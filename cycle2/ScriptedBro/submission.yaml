builder_story: "I grew up on timeless 16-bit action platformers games where
  tight controls, fluid combat rhythm, and mastering enemy attack patterns made
  victory feel earned. When exploring Web3 and micro-transaction gaming, I
  noticed a frustrating pattern: too many games sacrificed fun for financial
  mechanics, bogging players down with gas fees, slow confirmations, and
  friction-filled wallet popups.\r

  \r

  I built Luna Blade to prove that blockchain gaming could be different. My goal
  was simple: make a genuinely great, fast-paced retro arcade game first.\r

  \r

  I wanted every jump, sword slash, wall-slide, and boss encounter to feel
  punchy and responsive. Leveraging Nimiq’s instant, low-friction micropayment
  rails allowed me to seamlessly weave crypto into the arcade experience—turning
  in-game achievements, boss bounties, and crystal harvests into real,
  instantaneous rewards without interrupting the action. Luna Blade is my love
  letter to classic combat platformers, built for the modern decentralized web."
