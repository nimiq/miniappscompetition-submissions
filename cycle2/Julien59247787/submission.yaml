builder_story: "We kept staring at the same problem: picking a Nimiq validator
  meant scrolling a dry table of stats most people never look at twice. So we
  rebuilt the decision as a swipe — compare uptime, reliability and reward rate
  at a glance, set a few favorites aside, then delegate for real in one tap. It
  works inside Nimiq Pay and via Nimiq Hub from any browser, in 11 languages,
  with zero custody the whole way through."
