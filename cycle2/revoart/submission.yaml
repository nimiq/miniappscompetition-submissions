builder_story: "Parking is a solved problem in theory and a miserable one in
  practice. You circle a block, you find nothing, you pay a machine that eats
  your card, and the space you eventually take belongs to someone who'd happily
  rent it to you.\r

  \r

  ParkPilot closes that loop. It runs inside Nimiq Pay, so there is no signup,
  no card, and no custodian — a driver pays a host directly from their own
  wallet, in NIM, in one approval. Hosts list a driveway in minutes and get paid
  automatically.\r

  \r

  Building it meant solving a real one: proving a wallet is yours without a
  signature scheme. Nimiq Pay's sign() returns a signature that neither Nimiq's
  own verifier nor standard Ed25519 can validate, so we authenticate with a 1
  Luna transfer instead — the sender of a transaction is on-chain proof of
  ownership, and nobody can forge it."
