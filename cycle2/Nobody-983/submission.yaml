builder_story: "I built Nimiq NFT to explore how NFTs can become more than just
  digital collectibles. The idea was to create a simple, wallet-native
  experience where users can create, discover, and trade NFTs while also having
  a reason to keep coming back.\r

  \r

  I combined an NFT marketplace with Nimiq Pay payments and a gamified rewards
  system, allowing users to play, earn rewards, and use their Nimiq within the
  platform.\r

  \r

  As a developer learning and building with Nimiq, this project gave me the
  opportunity to work hands-on with wallet authentication, NIM transactions, NFT
  ownership, marketplace logic, and on-chain interactions while focusing on
  creating an experience that is actually fun to use."
