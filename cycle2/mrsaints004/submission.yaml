builder_story: I wanted to build something that shows what Nimiq Mini Apps can
  actually do beyond payments and utilities. A game felt like the perfect way to
  push the SDK - it uses device identity for verified leaderboard entries, NIM
  payments for a cosmetic car shop, and message signing for daily streak
  check-ins. The whole thing runs at 60fps in the browser using Three.js, works
  on both desktop and mobile, and degrades gracefully outside Nimiq Pay so
  anyone can play. The leaderboard, anti-cheat system, achievements, and friend
  challenges all run on a backend API. I built it because crypto needs more fun
  stuff, and because proving real usage through an actual game people want to
  play felt more interesting than another dashboard.
