builder_story: "Ralli came from a simple series of questions.\r

  \r

  The first was: why Mini Apps on Nimiq Pay?\r

  \r

  When I started researching, one description stuck with me: Nimiq was turning
  its payment app into a platform where developers could build Mini Apps that
  extend what the app can do.\r

  \r

  As a frontend developer, that immediately interested me. A lot of what I enjoy
  building is focused on making blockchain infrastructure disappear into the
  background, so normal users can use a product without first needing to
  understand wallets, networks or how crypto works.\r

  \r

  That led to a more personal question:\r

  \r

  What could I build inside Nimiq Pay that I would genuinely send to my friends
  who know nothing about Nimiq — and they would have a reason to open it?\r

  \r

  I didn't want the answer to be another financial tool. I wanted something they
  could open because it was fun, because a friend sent them something, or
  because other people were doing something they wanted to join.\r

  \r

  That's where the idea of a social Mini App started.\r

  \r

  Ralli became an experiment around a simple idea: give people things to do
  together, then let Nimiq provide a native value layer underneath those
  interactions.\r

  \r

  A friend can pass you a Ralli. You respond with a photo or video. Someone else
  joins. A chain starts growing. If people really want to see a Ralli happen,
  they can Boost it with NIM. If someone's response makes you laugh or genuinely
  impresses you, you can Tip them directly.\r

  \r

  The social interaction comes first; the blockchain stays underneath.\r

  \r

  Ultimately, I built Ralli because I wanted to explore a different reason for
  someone to discover Nimiq Pay: not because they were looking for a crypto
  wallet, but because someone or something they cared about brought them there."
