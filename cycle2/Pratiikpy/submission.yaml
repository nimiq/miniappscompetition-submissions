app_name: Scoresheet
category: Games
tagline: Chess.com owns your rating. Here you and your opponent sign for it.
description: "Play chess in Nimiq Pay: both players sign the result with their own wallet,
  and the rating is derived from those two signatures rather than stored on our server —
  so anyone can recompute it in their own browser, and nobody can revoke it. For everyone
  who has lost a rating to a closed account, a deleted profile, or a site that shut down."
