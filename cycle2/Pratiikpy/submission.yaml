  \r

  I kept losing ratings. Not games — ratings. An account closed, a platform shut
  down, a number that was mine right up until it wasn't, because it never lived
  anywhere I controlled.\r

  \r

  So before writing a line of code I read. 𝗙𝗼𝗿𝘁𝘆-𝗻𝗶𝗻𝗲 𝗿𝗲𝘀𝗲𝗮𝗿𝗰𝗵
  𝗻𝗼𝘁𝗲𝘀: Lichess and Chess.com as products, lila as an architecture,
  Stockfish and NNUE, puzzle selection, fair play, FIDE Swiss pairing, portable
  identity, and what a chess rating actually is. Every note answered the
  𝘀𝗮𝗺𝗲 𝗻𝗶𝗻𝗲 𝗾𝘂𝗲𝘀𝘁𝗶𝗼𝗻𝘀 and every claim carried a source URL or
  was marked NOT VERIFIED. One of those nine — what can we uniquely do because
  of Nimiq — is what turned this from a chess app that happens to have a wallet
  into the thing it became: 𝘁𝗵𝗲 𝘀𝗶𝗴𝗻𝗮𝘁𝘂𝗿𝗲 𝗶𝘀 𝘁𝗵𝗲
  𝗿𝗮𝘁𝗶𝗻𝗴.\r

  \r

  Then I built it. Our own board, our own engine, our own opening book — because
  nearly the whole chess ecosystem is GPL or AGPL, this had to be MIT, and
  shipping JavaScript to a browser counts as distribution. Nothing here is a
  wrapper.\r

  \r

  𝗧𝗵𝗲 𝗺𝗼𝘀𝘁 𝘂𝘀𝗲𝗳𝘂𝗹 𝗱𝗮𝘆 𝘄𝗮𝘀 𝘁𝗵𝗲 𝗼𝗻𝗲 𝘄𝗵𝗲𝗿𝗲
  𝗲𝘃𝗲𝗿𝘆𝘁𝗵𝗶𝗻𝗴 𝗽𝗮𝘀𝘀𝗲𝗱 𝗮𝗻𝗱 𝘁𝗵𝗲 𝗽𝗿𝗼𝗱𝘂𝗰𝘁 𝘄𝗮𝘀
  𝘀𝘁𝗶𝗹𝗹 𝗯𝗿𝗼𝗸𝗲𝗻. 590 browser checks green — and inside Nimiq Pay,
  Resign sat underneath Android's gesture bar on a screen that cannot be
  scrolled. You could start a game in the wallet and never finish one.
  env(safe-area-inset-bottom) reads 𝗲𝘅𝗮𝗰𝘁𝗹𝘆 𝘇𝗲𝗿𝗼 in that WebView, so
  no browser could ever have told me. Then, while shooting the demo film, I
  found a second one: in a game between two real people, 𝗻𝗲𝗶𝘁𝗵𝗲𝗿
  𝗱𝗲𝘃𝗶𝗰𝗲 𝗲𝘃𝗲𝗿 𝗰𝗼𝗹𝗹𝗲𝗰𝘁𝗲𝗱 𝘁𝗵𝗲 𝗼𝗽𝗽𝗼𝗻𝗲𝗻𝘁'𝘀
  𝘀𝗶𝗴𝗻𝗮𝘁𝘂𝗿𝗲 — so the one screen this entire product rests on was
  quietly excluding every real game. Both are fixed. Both now have tests that
  fail if they come back.\r

  \r

  What I would like you to do is not believe any of this. Open a record and
  press 𝗥𝗲𝗰𝗼𝗺𝗽𝘂𝘁𝗲. Your browser re-derives the number from the
  signatures alone, with my server switched off, and prints what it reached
  beside what I showed you. If they ever disagree, I am wrong — and the page
  says so.\r

  \r

