builder_story: "I built NimCatch as a simple experiment to explore what a fun
  and lightweight game could look like inside the Nimiq Mini Apps ecosystem.\r

  \r

  The idea was to turn NIM into something interactive rather than only something
  users see as a balance or payment asset. I wanted the first version to be easy
  to understand: open the app, start playing, catch the falling coins, build
  combos, and try to beat your high score.\r

  \r

  I built the app from scratch and focused on keeping the experience fast,
  simple, and mobile-friendly. NimCatch is also a starting point for exploring
  future gameplay mechanics, rewards, and deeper integration with the Nimiq
  ecosystem."
