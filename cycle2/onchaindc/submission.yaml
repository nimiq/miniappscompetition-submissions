builder_story: "Chess is already competitive, but most online chess experiences
  stop at the match itself. I wanted to build something that makes chess feel
  more like a competitive community: play  opponents, build a rating, challenge
  friends, follow live games, enter tournaments, and have something meaningful
  on the line.\r

  \r

  That became ChainMate , a chess platform built around the idea that every game
  should contribute to a player's competitive journey.\r

  \r

  The Nimiq Mini Apps Competition gave that idea another layer. Instead of
  adding a wallet as a separate crypto feature, I wanted NIM to become part of
  the competition itself: players can connect their Nimiq wallet, enter
  skill-based tournaments with NIM, compete for prize pools, and build a
  reputation through their results.\r

  \r

  The goal is simple: make competitive chess feel deeper, more social, and more
  rewarding without getting in the way of the game.\r

  \r

  ChainMate is for players who want more than a one-off chess match, a place to
  play, compete, improve, and come back for the next game."
