builder_story: Splitting shared expenses often becomes unnecessarily
  complicated. Someone has to calculate every share, copy wallet addresses,
  remind participants, and check payment screenshots manually. I built SplitNIM
  to make that process simple and transparent. Each participant receives a
  personal payment link or QR code with the exact amount already prepared, while
  Nimiq Pay securely handles the transaction and SplitNIM verifies every payment
  on-chain.
