builder_story: "A voice note recorded months in advance by someone who knew they
  might not be around. The phone died before it was ever heard. That moment
  never arrived.\r

  \r

  That stayed with us. And one question wouldn't leave, what if a message could
  be sealed today and guaranteed to arrive exactly when it should? Not stored in
  a phone that breaks. Not lost in a folder no one checks. Locked, waiting, and
  delivered on time.\r

  \r

  We live in an age of instant everything. But the moments that actually hit, a
  letter written months ago, a photo from a night you almost forgot, a gift that
  arrives when someone needs it most, those are never instant. We wanted to
  bring that intention back.\r

  \r

  Then we asked one more question. What if a capsule could carry real value too?
  A letter from your parents on your 18th birthday is powerful. A crypto gift
  they locked away years ago alongside it, that's someone investing in your
  future, literally.\r

  \r

  Nimiq made that possible. Lightweight, seamless, built for human first
  experiences. No complicated setups. No gas fees. Just seal it and let time do
  the rest.\r

  \r

  We're not building for likes. We're building for the moments that actually
  matter."
