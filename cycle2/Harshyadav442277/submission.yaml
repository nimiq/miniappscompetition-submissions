builder_story: "Paying with NIM is easy; giving money back is not. Today a
  crypto refund is a second payment to an address someone pasted into an email,
  with nothing proving that address belongs to the buyer. Rewind makes the
  refund part of the payment. Every payment carries an order reference; the
  server reads it on chain, and a refund can only be requested by signing a
  one-time message in Nimiq Pay with the wallet that funded the payment. The
  refund is a new transaction that Rewind also verifies on chain and links to
  the payment on one receipt.\r

  \r

  Building it on mainnet taught me how Nimiq Pay actually pays: out of an HTLC
  contract that your wallet funds, signed by your wallet. My first refund to
  that contract failed on chain, so Rewind now reads the payment's account type
  and sends the refund to the wallet behind the contract, even after the
  contract has closed.\r

  \r

  Try the Demo Store alone for 0.01 NIM, or register a shop with one signature
  and share a payment link. The code is MIT, and README-DEV lists the mainnet
  transactions behind each claim."
