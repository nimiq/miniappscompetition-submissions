builder_story: "Growing up, I used to play a typing game on my father's laptop,
  it was structured level by level, each one harder than the last, and the top
  level felt impossible at first. I kept coming back to it though, and after
  months and months of playing, I finally cleared the highest level. That's when
  the game changed for me, it stopped being about beating the levels and became
  about beating my own best time. There was this specific thrill in finishing
  before the timer ran out, and I'd stumble on words I'd never seen before and
  remember them just from typing them out. It stuck with me because it wasn't
  really about typing. It was focus, in a way nothing else at that age gave
  me.\r

  \r

  That's the itch behind NIMblers. Most \"focus\" and \"productivity\" tools
  tell you to focus but give you nothing to actually engage with, no stakes, no
  opponent, no reason to stay locked in. NIMblers solves that by turning focus
  into a game: you're racing a real person, timing's server-verified so no one
  can fake it, and there's a small NIM stake to make it matter. It's the same
  thrill that pulled me in as a kid, grinding through levels, then chasing my
  own best time, just sharper now, with a real opponent and something on the
  line.\r

  \r

  There is a practice mode, to practice before dipping your hands into the real
  duel. There are public (You can start or join as a challenger and each created
  duels is open to the public) and private duels (private duels is just a
  challenge between two friends on who types faster and is more focused with a
  stake involved).\r

  \r

  Stake. Type. Win."
