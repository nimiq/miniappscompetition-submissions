builder_story: "I built NimRequest after noticing something simple but real:
  bill-splitting apps tell you who owes what, but nobody actually follows
  through, because asking a friend for money feels awkward — and freelancers
  face the same problem in reverse, doing work and just hoping they get paid. I
  wanted something that didn't just log a debt, but structurally solved it:
  either make the ask effortless, or hold the money until both sides genuinely
  agree it's earned. Every part of it  the escrow logic, the automatic payout,
  the proof-of-settlement view  is real and tested on Nimiq's testnet with
  actual on-chain transactions."
