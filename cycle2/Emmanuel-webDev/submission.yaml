builder_story: "Stash was inspired by a simple problem: people often want to
  save, but saving is easy to postpone.\r

  \r

  I wanted to make saving happen closer to the moment money is already moving.
  Instead of asking users to remember to transfer funds later, Stash connects
  saving to everyday NIM payments. You choose a goal and a rule, then Pay &
  Stash guides you through paying someone and saving a small amount in the same
  flow.\r

  \r

  The second inspiration was what happens when people miss a saving opportunity.
  Most habit tools simply break the streak or leave the user feeling like they
  failed. Stash uses **Catch-up** instead. If the savings step is skipped, the
  amount is remembered and can be cleared later.\r

  \r

  That led to the core idea:\r

  \r

  **Save when you spend. Catch up when you miss.**\r

  \r

  I also wanted Stash to feel motivating without becoming a game about spending
  more, so streaks, milestones, and rewards are tied to **saving consistency**,
  not purchase volume.\r

  \r

  The result is a non-custodial Nimiq Pay Mini App built around one goal: make
  saving a repeatable habit instead of something users have to remember to do."
