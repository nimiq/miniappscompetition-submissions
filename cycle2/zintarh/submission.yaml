builder_story: "I spent years wrestling with focus apps that worked for a week
  before losing their novelty. The issue was simple: skipping a session carried
  no real consequence.\r

  \r

  NimPet turns focus into responsibility:\r

  \r

  Evolve Through Deep Work: Complete sessions to hatch your egg and grow your
  pet from baby to Elder.\r

  \r

  Real Accountability: Abandon your work for too long, and your pet dies.
  Reviving it requires a tangible cost.\r

  \r

  True Ownership: Your milestones and companion stats are backed on-chain—never
  lost to device wipes or resets.\r

  \r

  Native Payments: Spend NIM natively through Nimiq Pay with zero checkout
  friction or extra account setup.\r

  \r

  Stop relying on willpower alone—build a companion that grows only when you
  do."
