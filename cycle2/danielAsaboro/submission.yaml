builder_story: "Dwellence focuses on the gap between a property listing and the
  everyday conditions someone will live with. The app commissions fresh
  connectivity and environmental evidence, keeps exact property results private,
  and coordinates direct NIM payments to contributors. The build emphasizes
  consent, recoverable errors, signed readings, independent payment
  verification, and clear limits: wallet signatures establish key control, and
  reports are informational. The public MIT repository passes 89 controlled
  tests. Live browser checks and one partial iPhone observation are recorded;
  physical sensors, completed native payments, and real-user feedback still need
  verification.\r

