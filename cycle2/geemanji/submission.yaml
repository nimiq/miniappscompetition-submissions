builder_story: "I started building NIM Panic after spending a lot of time
  thinking about how to make crypto feel less complicated and more fun.\r

  My first instinct was to build a prediction market.\r

  Then I started using my own product and realized something was missing.\r

  I didn't want another screen full of charts and numbers.\r

  I wanted that feeling of:\r

  \"Wait... I have 20 seconds to make this call?\"\r

  So I started rebuilding around the feeling instead of the feature.\r

  I'm experimenting with categories, streaks, challenges, leaderboards, 1v1s
  and, of course, NIM.\r

  Some ideas will work.\r

  Some won't.\r

  This is NIM Panic."
