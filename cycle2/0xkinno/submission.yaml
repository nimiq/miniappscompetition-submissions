app_name: PROVENIM
category: On-chain services
tagline: Before a merchant fulfils an order, Provenim proves the NIM payment
  that is supposed to pay for it.
description: Provenim verifies NIM payments against real Nimiq Testnet evidence,
  binding each payment to its intended transaction and producing tamper-evident
  receipts that anyone can independently verify.
