builder_story: "Building Provenim started with a question: what should “paid”
  actually mean?\r

  \r

  Most payment experiences stop at a wallet callback, a database flag, or a
  transaction appearing somewhere in account history. For a merchant, however,
  the real question is much simpler and more consequential: can I safely fulfil
  this order?\r

  \r

  I built Provenim by starting from Nimiq’s infrastructure rather than from a
  generic payments UI. The discovery was that payment attribution can span
  different transaction and account representations, making a naive “I found a
  payment” check insufficient.\r

  \r

  So Provenim turns payment into a verifiable claim."
