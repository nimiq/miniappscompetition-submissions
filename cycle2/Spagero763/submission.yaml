builder_story: "Every web game leaderboard I have seen works the same way: the
  browser posts a number and the server writes it down. That is an honour system
  with extra steps, and one person with the network tab open ruins it for
  everybody else.\r

  \r

  So Tandem does not accept numbers. Your phone sends the inputs, one thumb
  position per tick, about nine kilobytes for a full heat, and the server
  re-runs the same simulation to work the score out itself. The client's own
  claim is kept for exactly one purpose: if it disagrees with the replay, the
  run is flagged and the replayed score is the one that counts. The simulation
  lives in a single module that both the browser and the server import, so there
  is no second implementation to drift apart.\r

  \r

  The part I care about most is that you can check this yourself. Every run has
  a public receipt that re-scores it from the stored inputs on every request and
  shows the stored and replayed numbers side by side, with the course seed and
  the replay size. Tap any row on the ladder and you land on it.\r

  \r

  The other decision worth naming is that playing is free and stays free.
  Backers fund the daily pot and cannot win it, staking makes you a Patron, and
  the Founder pack is two USDT on Polygon. Not one of them touches the ladder. A
  paid advantage in a scored game makes every score above yours ambiguous, and
  that is the one thing this design cannot afford."
