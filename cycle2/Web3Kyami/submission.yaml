builder_story: "I’m a community mod, and I’ve seen the same pattern too many
  times\r

  Pre launch and launch week is always loud, everyone is active, then a few
  weeks later the chat starts going quiet unless there’s another announcement,
  giveaway, or incentive.\r

  \r

  So I built Rallyo around that to make the community become the game.\r

  \r

  Projects can turn their own knowledge, terminology, updates, and community
  activity into Quiz/Race, Word Seek, Scramble, contribution tasks, seasons, and
  one shared leaderboard.\r

  \r

  Telegram is where the action happens. The Rallyo Mini App is where your
  identity, communities, rank, tasks, rewards, and Nimiq wallet come together.\r

  \r

  The idea is simple: give people a reason to come back even when there isn’t a
  big announcement happening."
