builder_story: "Truly began with a frustration I kept seeing in learning
  products: the lesson ends exactly where the real work begins. An explanation
  lives in one tab, the editor or application lives in another, and the learner
  is left to reconnect the two alone.\r

  \r

  I built Truly as two connected surfaces. The Nimiq Mini App owns identity,
  Tasks, creator Paths, payments, devices and progress. A native macOS companion
  stays beside the work, answers text or voice questions about a deliberately
  shared screen, and checks a visible result only when the learner asks it to.
  Teaching and completion are deliberately separate.\r

  \r

  Nimiq became more than checkout. Purpose-bound wallet signatures authorize the
  learner, creator, reviewer and paired Mac; NIM lets creators sell reviewed
  learning Paths without Truly taking custody; and progress follows the wallet
  owner across devices. Building and physically testing the complete flow also
  surfaced concrete SDK feedback, which is documented openly in the repository
  for the Nimiq Pay team."
