builder_story: "Most people want to save, but wanting to save and actually
  saving are two different things. Money comes in, expenses happen, and the
  intention to move something aside often gets pushed to the next day or next
  month.\r

  \r

  We wanted to explore what a wallet could do if it helped turn that intention
  into a habit.\r

  \r

  That led to Stride.\r

  \r

  Instead of treating Nimiq Pay as somewhere money simply sits and moves around,
  Stride turns everyday wallet activity into progress toward something
  meaningful. Users create a milestone, choose a saving rule that fits their
  life, and let small actions build toward the goal.\r

  \r

  We also wanted saving to feel more human. Some goals are personal, while
  others are shared with friends, teammates, or family. Stride brings those
  contributions together and makes the progress visible.\r

  \r

  The idea behind Stride is simple: you don't need to make a perfect saving
  decision every time. Small, repeatable actions can get you somewhere."
