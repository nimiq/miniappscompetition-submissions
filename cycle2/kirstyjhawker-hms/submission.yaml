app_name: Pay It Sideways
category: Social
tagline: Someone showed up for you. Show up for someone else.
description: Pay It Sideways sends a private note with optional NIM—no wallet address
  needed. The recipient can keep it or relay the exact gift into a fresh one-use
  link. Private acknowledgements, anonymous trails, sender recovery and on-chain
  checks make each chain safe and meaningful.
