builder_story: "I built this for my own house. I have small kids, and I want
  them to earn their own screen time and manage it. So I built my house its own
  mini economy.\r

  \r

  The reason was consistency. Chores got done some days and not others. This
  gets us working together toward a common goal: they do the jobs, they get
  rewarded, they get what they want, and the money circles back to the family. A
  circular economy.\r

  \r

  Jobs pay every day. Goals are separate: we set one together, it becomes a path
  of steps, and the prize waits at the top. It stops being a chore and starts
  being a game.\r

  \r

  Tested all month on two tablets with my own kids. Five languages. Use any URL
  or try it in the Nimiq Pay app today."
