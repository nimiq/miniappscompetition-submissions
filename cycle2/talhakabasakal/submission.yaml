builder_story: "I built NIMNear because I wanted to make it easier for people to
  discover real experiences happening around them and connect with their local
  communities.\r

  \r

  I noticed that finding nearby events, joining them, and handling payments
  often happen across different platforms. With NIMNear, I wanted to bring these
  experiences together in one simple application where users can discover nearby
  events, create their own gatherings, join communities, and pay for experiences
  using NIM.\r

  \r

  Nimiq inspired me to explore how crypto could work naturally in a real-world
  social application. Instead of making blockchain the main focus, I use it as
  infrastructure behind the experience. NIMNear uses Nimiq wallet authentication
  and supports NIM payments for paid events, with transactions verified on-chain
  before participation is confirmed.\r

  \r

  While building NIMNear, I worked through challenges such as wallet-based
  authentication, Mainnet transaction verification, browser and Nimiq Pay flows,
  and creating an experience that remains simple for users who may not be
  familiar with crypto.\r

  \r

  My goal with NIMNear is simple: use Nimiq to help turn nearby opportunities
  into real connections."
