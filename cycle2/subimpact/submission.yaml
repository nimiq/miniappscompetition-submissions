builder_story: "I entered the Nimiq Mini Apps Competition to answer one
  question: what does a real game look like inside a wallet? Cycle I had 91
  apps, most of them utilities and demos. I built Darkfall as a full game — 8
  depths, 15 monster types, bosses, randomized loot, three classes — then asked
  the harder question: what should the wallet actually *do* in a game? The
  answer became the Trading Post: players list dropped items and buy each
  other's for NIM, with the seller paid wallet-to-wallet and a 5% commission —
  no escrow, no custodial wallet, on-chain checks before item delivery. It's the
  first player-run economy inside Nimiq Pay. Every part of the game is free:
  payments buy only conveniences. The game, market, and leaderboard are open
  source and MIT licensed."
