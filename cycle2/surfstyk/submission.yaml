builder_story: "Stakes came from one observation: you don't lose a goal across a
  year, you lose it in a single weak moment, the ten seconds where the easy
  thing wins. So I built for that moment. You put a little of your own money on
  your word, keep the day, and get it back with a bonus. The dot shows up for
  the weak moment and keeps no score. It runs in Nimiq Pay, and every check-in
  is signed from your own wallet, on the chain for anyone to read."
