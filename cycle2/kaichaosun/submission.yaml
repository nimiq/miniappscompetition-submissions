builder_story: "1. Spam Protection\r

  \r

  We’ve all had enough of spam, random messages, and unwanted requests. Knock
  Chat gives you a simple way to take back control: set a small cost to connect,
  such as 1 NIM, or keep it free at 0 NIM. Communities can do the same by
  setting a cost to join and keeping bad actors out.\r

  \r

  2. A Creator Economy Without Ads\r

  \r

  Creators shouldn’t have to rely on ads to make money from their communities.
  With Knock Chat, value can flow directly between people through NIM. Users can
  pay to connect, join communities, send and receive NIM, or support others
  through gifts — creating a more direct and meaningful creator economy."
