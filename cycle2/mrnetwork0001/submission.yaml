builder_story: "Every AI photo tool is a subscription. I needed about three
  headshots a year, and the maths never worked: pay for eleven months you don't
  use, or go without.\r

  \r

  So I priced the actual unit of value; one finished photo, at ten cents. That
  only works on a rail where ten cents survives the fee, which is the whole
  reason NimSnap is a Nimiq Mini App rather than a website with a card form. \r

  \r

  The business model and the technology are the same decision.\r

  \r

  The part I cared most about was not taking anyone's word for a payment. The
  order id rides inside the transaction, so the server reads the chain itself
  and confirms the money landed before spending anything on the model and the
  finished shot links back to that transaction so the user can check it too. \r

  \r

  Sixteen payments have settled on mainnet so far."
