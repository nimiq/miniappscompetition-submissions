builder_story: "The problem\r

  Trust is expensive. Lending a drill to a neighbor, paying someone to fix a
  bench, or offering rewards for certain tasks fails on the same thing:
  strangers don't trust each other.. and traditional escrow just means trusting
  a platform instead.\r

  \r

  What Acta is\r

  A proof-of-action protocol. Every interaction is one pipeline: \r

  - an act happens in reality\r

  - an oracle verifies it\r

  - NIM moves. \r

  \r

  Borrowing and bounties are the first two types of act on that pipeline, not
  the product itself.\r

  \r

  Four oracles\r

  - PhotoProof: an AI judge checks each photo against the sponsor's written
  criteria, inserted into the prompt verbatim.\r

  - ScanQuest: an Ed25519 signed token hidden in the physical world; the
  signature itself is the proof of presence.\r

  - CheckIn: GPS radius, sub 50m accuracy, and a time window.\r

  - Request: the sponsor signs the release; the AI can pre-screen submissions,
  but the human decides.\r

  \r

  Why Nimiq\r

  1. Subsecond finality: in-person handoffs can't wait minutes for
  confirmations; locks feel like tap to pay.\r

  2. Mini App SDK: Acta runs inside Nimiq Pay itself; one signature locks
  collateral, no installs, no extensions.\r

  3. Real transactions: every lock, funding, and payout is an onchain
  transaction with an explorer receipt linked in the app. Remove `window.nimiq`
  and nothing can authenticate, lock, fund, or pay.\r

  \r

  Honest scope\r

  Escrow releases are server gated by the vault key in this build (locks and
  fundings are user signed onchain transactions); HTLC escrow is the documented
  production path. Limitations are listed in the README."
