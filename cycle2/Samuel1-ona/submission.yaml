builder_story: "Why we built Terreno\r

  \r

  \r

  So Terreno came out of Blokaz and Nukku. Those were games but honestly they
  were us figuring things out. 101,112 transactions. 24,415 players who made
  wallets and actually showed up. We got to watch where people quit, where they
  got stuck, what brought them back.\r

  \r

  \r

  Main thing we took from it: nobody wants to be told ownership means something.
  They want to see it.\r

  \r

  \r

  So that's Terreno. One map, 5,622 plots on a 170x100 grid, live on Base. Every
  plot has an owner, a color, and a price, and all the prices are public. You
  open it, and you're looking at what's actually happening: who owns what, which
  corners people are fighting over, which land is just sitting there because
  nobody wants it.\r

  \r

  \r

  Same approach as before really. Watch what players do instead of guessing. Cut
  the friction that isn't fun. Keep the chain part quiet until it's the reason
  the thing works and not the reason people leave.\r

  \r

  \r

  101K transactions and 24K players got us here. One world map, priced in cents,
  fought over in real time, that's the next thing."
