builder_story: "The problem:\r

  \r

  Small physical sellers, market vendors, pop up stalls, indie cafes, face an
  unfair dilemma with retail payments. Traditional card terminals:\r

  \r

  Require expensive hardware leases\r

  Lock merchants into monthly subscription fees\r

  Take 3 to 5% off every small sale\r

  Hold funds for days\r

  \r

  Most existing crypto checkout tools don't help either. They're built for
  online webshops or force sellers into complex, custodial account systems.\r

  \r

  The solution:\r

  \r

  I built NimStall to solve this for the real world.\r

  \r

  By leveraging Nimiq Pay, any smartphone, tablet, or browser tab becomes a
  functional cash register in 60 seconds, with zero upfront hardware costs and
  0% platform commission.\r

  \r

  The app:\r

  \r

  Connects directly to the merchant's Nimiq wallet\r

  Lets staff build carts on a touch optimized grid\r

  Generates dynamic QR codes that carry order payloads straight to customer
  phones, with no intermediary cloud servers needed\r

  \r

  What I'm most proud of:\r

  \r

  The verification mechanism. The terminal never relies on client side
  assumptions. It embeds the order reference directly into the on chain
  transaction data payload and polls Nimiq network consensus to verify block
  inclusion before confirming the sale and issuing a digital receipt."
