builder_story: "I kept running into the same friction with crypto payments: the
  asset you want to spend isn't always the asset you need to pay the network.\r

  \r

  I built NimZero to remove that extra step. The idea is simple: if someone
  already has the money they want to send, they shouldn't have to acquire
  another token just to make the payment. I wanted to see how far that could be
  pushed inside Nimiq Pay, so I built the full flow around sponsored execution
  and independent on-chain verification."
