app_name: NimZero
category: On-chain services
tagline: Pay USDT on Polygon without POL.
description: "NimZero lets NimiqPay users send USDT on Polygon without holding
  POL.\r

  \r

  A user enters a recipient and amount, reviews the payment, and authorizes it
  directly in Nimiq Pay. NimZero sponsors the Polygon gas while binding the
  authorized amount and recipient"
