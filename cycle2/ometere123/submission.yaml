builder_story: "I built Turn because refundable deposits for reusable items are
  still often handled with cash, paper tickets or trust.\r

  \r

  Turn keeps it simple. A merchant creates a counter and sets a refundable
  amount in NIM. The customer pays the merchant directly, and that payment
  becomes the return receipt. When the item is returned, Turn verifies the
  original transaction, amount and refund address before the merchant sends the
  refund.\r

  \r

  Turn is not escrow and cannot force a refund. It simply makes the payment and
  refund trail clear and verifiable on Nimiq without accounts, custody or a
  backend holding users’ money."
