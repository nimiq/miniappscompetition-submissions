app_name: Turn
category: On-chain services
tagline: Refundable NIM deposits for reusable items.
description: Turn lets merchants take refundable NIM deposits for reusable items
  without cash or accounts. Customers pay the merchant directly, keep an
  on-chain return receipt, and get the same NIM back when the item is returned.
