builder_story: "We make predictions about people constantly. Would they share?
  Would they trust a stranger? Would they reject an offer they think is unfair?
  Usually, there’s no way to put those hunches to the test.\r

  \r

  I built Hunch to turn that curiosity into a live behavioral experiment. You
  make a real decision with NIM, lock your prediction about what another person
  will do, wait for their independent decision, then reveal the outcome and
  compare your hunch with real behavior and published research.\r

  \r

  I wanted Nimiq Pay to be part of the experiment itself, not just a payment
  button added at the end. Hunch uses wallet signatures to commit decisions,
  server-side locking to keep two-player choices blind, and real Nimiq
  transactions for settlement.\r

  \r

  Hunch currently has three experiments: Split, where you decide how much NIM to
  keep or pass forward; Trust, where another person decides what comes back; and
  Ultimatum, where another person decides whether to accept your offer.\r

  \r

  Throughout the build, I focused on making the experience understandable within
  seconds while keeping the mechanics real. No accounts, no simulated balances,
  no random outcomes, and no personality scores. Just a simple loop:\r

  \r

  Decide. Predict. Wait. Reveal. Compare.\r

  \r

  The result is Hunch, a small experiment on whether we’re actually as good at
  reading people as we think we are."
