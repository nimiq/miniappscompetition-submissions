builder_story: "Hey, im zach\r

  \r

  I love Nimiq and I want more people to actually use it. Most newcomers get
  lost - they don’t know which of the Mini Apps to start with, they dont know
  how to simply build on nimiq, some find it hard to go through docs one by one
  to get answers about what they need to know about nimiq.\r

  \r

  I built Nimglyde for anyone already using Nimiq and anyone curious to start.
  You connect your wallet and you can ask anything - how to buy NIM, how to send
  it, nimiq miniapps and how to use them - and it answers from verified docs and
  live chain data, links you straight to the mini app page, and also you can ask
  Nimglyde for $NIM price without having to start opening any exchange app.\r

  \r

  It’s a small entrance that makes the whole ecosystem feel approachable. If it
  helps one more person stay and build on Nimiq, it’s worth it."
