builder_story: "I needed to invoice without putting a receiving wallet on a
  public page. Most “private pay” tools oversell anonymity. StealthPay is the
  opposite: the client sees who you are, the work, and the amount. The wallet
  stays off the invoice. Settlement is a normal NIM transfer. Private invoices,
  not a mixer."
