builder_story: "I kept looking at NIM in my wallet and thinking: what can I
  actually do with this?\r

  \r

  Not swap it. Not stake it. Spend it. Where I live, that's the only test a
  currency has to pass — can it buy airtime, can it buy groceries, can it help a
  friend who's run out of credit.\r

  \r

  So I built Kindo. Open it inside Nimiq Pay and you're shopping with NIM:
  airtime and data on any number, gift cards from 10,000+ brands — Amazon,
  Steam, Roblox, Spar Nigeria for groceries — real flight fares from real
  airlines, and restaurant tables. No card, no bank, no account. You tap an
  amount, Nimiq Pay asks you to approve, and the thing shows up. The NIM payment
  is the checkout.\r

  \r

  Under the hood: your payment is matched on-chain by the order in the
  transaction memo, then the provider gets paid in USDC over x402 — no API keys,
  no merchant accounts, on Base and Solana depending on the provider. Every cost
  is checked against what you actually paid before anything moves, and small
  orders draw from a standing float that gets swept back to USDC in batches."
