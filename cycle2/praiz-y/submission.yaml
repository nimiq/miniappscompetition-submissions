builder_story: "I built ROVA because I wanted to explore what a contest platform
  could look like when wallets and payments are part of the experience from the
  beginning. I started with quizzes as a simple way to build and test the core
  flow: a creator sets up a contest, participants join with their Nimiq wallet,
  compete, and see their results. The bigger idea is to make the platform
  flexible enough for different types of community competitions beyond quizzes."
