builder_story: "I built PACT because informal deals fall apart in a specific,
  avoidable way:\r

  nobody wrote down what was actually agreed. The Nimiq wallet already sits\r

  between two people who trust each other enough to work together, PACT just\r

  makes that trust legible. Every agreement gets a Seal: a visual fingerprint\r

  of its exact terms, derived from the same digest both sides sign. Change one\r

  word and it visibly changes shape, so nobody can quietly redraft what was\r

  promised. No escrow, because the framework gives no way to hold funds\r

  honestly, so PACT says exactly that instead of pretending otherwise."
