builder_story: "Millions of people pay for everything with crypto, except
  travel. Online Travel Agencies still demand cards, KYC, and bank accounts,
  forcing crypto users to off-ramp just to book a hotel.\r

  \r

  So we built Triply: a travel marketplace where your wallet is your account.
  Search real flights through Duffel, book stays and cars, pay with USDT on
  Polygon, and earn NIM cashback - all settled on-chain in minutes. \r

  \r

  We built it as a Nimiq Mini App to prove the ecosystem can power real-world
  commerce: Nimiq identity is the login, Nimiq points are the loyalty loop, and
  the flow feels native in Nimiq Pay. \r

  \r

  We built the app we'd want to fly with."
