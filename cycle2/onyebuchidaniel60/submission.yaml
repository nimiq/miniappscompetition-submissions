builder_story: "The idea came from a simple observation: valuable capacity can
  disappear just because the person who originally booked it can no longer use
  it.\r

  \r

  A restaurant table can sit empty after a last-minute cancellation. A sports
  court can have an unused hour. A class can have an empty seat. An appointment
  can go unfilled. In each case, the capacity still has value, but once the
  original user gives it up, there often isn't a simple way to get that value to
  someone else who wants it.\r

  \r

  I wanted to build a marketplace around that moment.\r

  \r

  TAKEOVER is designed to give released capacity a second chance. Someone who
  can no longer use a reservation, booking, appointment, ticket, or other
  transferable slot can publish it as an opening. Someone else looking for a
  last-minute opportunity can discover it, claim it, and complete the
  transfer.\r

  \r

  The problem isn't simply that people cancel things. The bigger problem is the
  disconnect between released capacity and people who could immediately use
  it.\r

  \r

  TAKEOVER tries to close that gap.\r

  \r

  I also wanted the transaction itself to feel trustworthy. Instead of making a
  buyer send money directly to someone they don't know and hoping the handoff
  happens, TAKEOVER uses escrow for the purchase. The payment is secured while
  the transfer takes place and released when the required conditions are met.\r

  \r

  NIM has a specific role in the marketplace as well. Providers pay a 400 NIM
  listing fee when publishing an opening. This acts as a platform service charge
  while also adding an economic barrier against spam and mass automated
  listings.\r

  \r

  The result is a marketplace where the underlying payment infrastructure is
  important, but the product isn't about crypto for its own sake.\r

  \r

  Basically turns “I can't use this anymore” into “someone else can.”\r

  \r

  TAKEOVER is my attempt to make that last-minute exchange simple, useful, and
  trustworthy."
