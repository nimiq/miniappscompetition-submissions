builder_story: "Inside Nimiq's community — Mini Apps testers, translators,
  designers, and helpful builders — the best work often ends as a thank-you lost
  in a chat. I kept watching contributors do real, valuable work with nothing
  durable to show for it. The problem isn't that people aren't grateful; it's
  that gratitude evaporates. No link, no record, no way to prove later that the
  work happened.\r

  I wanted to build something that turns \"thanks\" into something a contributor
  can hold onto: a name they own, a payment that actually happened, and a record
  they control.\r

  What problem does it solve?\r

  1. Lost credit for real work. Contributors get a wallet-bound .neet name that
  becomes a home for their contributions — a portable profile they can share
  when the next opportunity comes.\r

  2. Unverifiable claims. No trust scores or badges (which can be gamed).
  Instead: every acknowledgment is backed by a real NIM payment and a wallet
  signature. A server-side check confirms the transaction actually matched the
  receipt — amount, recipient, and reference. You can inspect the evidence
  yourself.\r

  3. No way to take your contributions with you. Contributors choose which
  receipts to publish and carry their record outside the original chat. It's
  portable proof of work.\r

  4. Privacy and self-custody. Keys stay in Nimiq Pay. Dotneet never sees a
  private key — everything runs inside the mini-app experience.\r

  Why Nimiq? NIM payments are accessible, micro-payments are cheap, and the Mini
  App SDK makes wallet-bound acknowledgments possible inside one self-contained
  Nimiq Pay experience. Dotneet shows how on-chain payments can back off-chain
  records of trust — credible, private, and genuinely useful."
