builder_story: "Small businesses want repeat customers, but loyalty programmes
  are built for chains: apps, POS integrations, printed cards that get lost.
  Nimiq's built-in rewards work at curated partner locations; NimStamp lets any
  merchant anywhere set up loyalty in 60 seconds.\r

  \r

  NimStamp is a digital stamp card that lives inside Nimiq Pay. A merchant signs
  in with the wallet that receives their payments, fills one form, and gets a
  link and a printable QR table tent. Customers open the link, tap Pay, and earn
  a stamp automatically every time they pay in NIM. When the card is full they
  redeem with one tap and show the cashier a four-letter code.\r

  \r

  It uses Nimiq Pay end to end: sendBasicTransactionWithData attaches a tagged
  memo so the server can match each payment on the Nimiq blockchain, sign()
  proves wallet ownership for merchant login and reward redemption,
  requestDeviceIdentifier limits cards per phone, and the language API switches
  the interface between English, Spanish, German and French. The server is the
  only authority: it verifies every payment and signature on chain and never
  holds funds.\r

  \r

  Everything is public and verifiable. The stats page
  (nimstamp.vercel.app/stats) lists every business, stamp and redemption with
  links to nimiq.watch — 6 stamps for 1 customer at 1 business at the time of
  submission.\r

  \r

  For coffee shops, barbers, market stalls and anyone else who takes NIM."
