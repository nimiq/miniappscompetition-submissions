builder_story: "Every mini app I saw paid the wallet. I wanted one where the
  wallet gets paid. The server runs the world and decides every hit, so nobody
  can send it a score. Nimiq made the rest easy: no accounts, no gas, a memo on
  every payout, and a two hour transaction window that shaped how the treasury
  pays."
