builder_story: "Every freelance platform's worst reviews are the same complaint
  in different words: locked\r

  out of an account holding money you earned, a 20% cut, a two-week wait to
  withdraw, support\r

  that never answers. None of that is a policy problem — it's what happens when
  a platform\r

  holds your money and your identity at the same time. chit doesn't hold either.
  There's no\r

  account to be locked out of and no balance to freeze, so the failure modes the
  whole industry\r

  apologizes for don't exist here to apologize for. What's left is the smallest
  possible\r

  object: one line of text, signed by both sides, paid in NIM the moment it's
  signed. Building\r

  it against Nimiq Pay specifically meant the \"instant, feeless, works for an
  empty wallet\"\r

  claim had to be literally true before it could be a selling point — a $3 tip
  and a $200\r

  invoice go through the exact same five taps."
