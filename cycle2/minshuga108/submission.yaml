app_name: Chit
category: Productivity
tagline: Paste the deal you already agreed. Both sign it. The payment carries the proof.
description: Turn any agreement from Discord, WhatsApp, or DMs into a signed,
  on-chain receipt in one second using Nimiq Pay. No accounts, no fees, and no
  middleman holding your funds—just direct wallet-to-wallet payments with
  permanent proof anyone can verify.
