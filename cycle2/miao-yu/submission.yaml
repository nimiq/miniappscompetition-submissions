builder_story: "I run a staking pool and explorer at nimiq.cafe and kept failing
  to answer the\r

  simplest question people asked: what is my NIM actually doing? Balances are
  easy\r

  to look up; what it has been worth, and what it has earned, is not - and if
  you\r

  staked elsewhere, my records knew nothing about you.\r

  \r

  So the Portfolio works whoever you stake with, reading rewards from the
  chain\r

  rather than from my own pool's books. And because the chain cannot tell you
  what\r

  you held last month, it reconstructs your past balances from on-chain
  activity,\r

  so the history is there the moment you sign in instead of a year later."
