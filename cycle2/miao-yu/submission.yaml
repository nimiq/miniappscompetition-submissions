tagline: Everything your NIM is doing, in one place.
description: NimiqCafe shows your full NIM position - liquid and staked
  balances, value over time, and daily rewards - whichever validator you stake
  with. It also bundles live network stats, a staking calculator, a NIM
  converter and a block explorer.
