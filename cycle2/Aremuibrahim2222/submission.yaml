builder_story: "Builder Story\r

  \r

  I built Nimiq Deals because I wanted to explore a simple question: how can
  crypto become something people actually use in everyday life, instead of just
  something they hold?\r

  \r

  While exploring the Nimiq Mini Apps ecosystem, I saw an opportunity to combine
  shopping with Nimiq Pay. Nimiq Deals lets users discover discounted products,
  pay with NIM or USDT, and earn cashback from their purchases.\r

  \r

  The problem I’m trying to solve is the gap between owning crypto and actually
  spending it in a practical way. Shopping is something people already
  understand, so I wanted to create a familiar experience while making Nimiq
  payments useful in a real world context.\r

  \r

  I kept the idea intentionally simple: \r

  find a deal → pay with Nimiq → earn cashback → come back for another deal.\r

  \r

  As a solo builder, I also wanted Nimiq Deals to be a practical demonstration
  of what can be built with Nimiq Pay Mini Apps and how crypto payments can fit
  naturally into everyday experiences."
