builder_story: "I wanted to build something that answered one question — what do
  people actually believe when there's real money on it? Not polls, not likes,
  not retweets. Skin in the game.\r

  \r

  Notch is a conviction market built natively on Nimiq Pay. Anyone can create a
  market on anything — sports, crypto, culture, tech. You pick a side, commit
  NIM, and the crowd settles it. Opinion markets auto-resolve when the timer
  ends — majority NIM wins. Prediction markets let the creator call the outcome.
  Winners split the full pool minus a 5% house cut.\r

  \r

  Every action is on-chain. Market creation costs 0.1 NIM and leaves an
  immutable on-chain proof. Every bet is tagged with a structured memo. Every
  payout is broadcast with a verifiable tx hash. Your wallet address is your
  identity — no signup, no account.\r

  \r

  The result is a platform that feels alive. Open Notch and you immediately see
  what people are putting real money behind right now. The probability numbers
  shift in real time as new bets come in. It's Polymarket energy inside your
  Nimiq Pay wallet."
