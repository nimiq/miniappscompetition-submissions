builder_story: "Growing up, I watched kids play **Zuma’s Revenge** almost every
  day, but I could not afford to play it myself. I remember wondering what it
  would feel like to have a game like that on my phone, something I could access
  and enjoy on my own.\r

  \r

  That memory inspired **Dynamio**. I wanted to recreate the excitement of chain
  reaction gameplay in a modern 3D experience while giving players a game that
  feels accessible, rewarding, and built for today’s devices. Dynamio is my way
  of turning a childhood experience of watching from the sidelines into
  something I could finally build and share."
