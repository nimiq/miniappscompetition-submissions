builder_story: "I wanted a game that feels like a real pencil not tap icons and
  pretend you’re drawing. Most mobile “action” games bury you under buttons; I
  built Doodle Champion so one thumb on a phone is enough: five simple marks,
  and where you draw changes what they do. Defend on your half of the page,
  attack across the fold. That rule is the whole game.\r

  \r

  It’s for people who want a quick, tactile duel in the browser challenge a
  friend with a shareable bout link, no live server required. On Celo, runs can
  optionally be saved on-chain without gating play behind a wallet connect. The
  problem it solves is simple: skill games in wallet browsers usually feel
  bolted on; this one is built thumb-first and stays playable even if crypto is
  off."
