builder_story: I wanted to build a fun, fast-paced game that is easy to pick up
  but challenging to master. Fruit Rush was inspired by classic fruit-slicing
  games, with a modern, colorful experience focused on quick reflexes,
  satisfying combos, and high scores. I built it to create a simple game that
  anyone can enjoy for a few minutes while still giving players a reason to keep
  coming back and beat their best score.
