builder_story: "At first, I simply wanted to recreate a feeling I loved from
  classic physics-based games: intuitive mechanics, three stones per team, and
  the simple goal of aiming, pushing, blocking and scoring in your opponent’s
  goal.\r

  \r

  Then I started thinking: what if this kind of simple, instantly playable game
  could also be a way to bring people into the Nimiq ecosystem?\r

  \r

  No crypto tutorial. No technical explanation. Just something fun that makes
  you want to play — and then come back.\r

  \r

  There was just one problem: I’m not a developer.\r

  \r

  So I got a Claude subscription, invested a lot of time and patience, threw in
  my best ideas, and started building.\r

  \r

  Step by step, through countless iterations, bugs, fixes and experiments,
  NimiCurl was born.\r

  \r

  It started as a simple idea to recreate a familiar game feeling. It became an
  attempt to build a small, accessible gateway into Nimiq — something you can
  discover through a friend, play with anyone, and hopefully keep coming back
  to."
