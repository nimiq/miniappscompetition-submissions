app_name: TrustPay
category: Shopping & deals
tagline: Secure every transaction. Trust every deal.
description: TrustPay is an escrow-powered Mini App that enables secure
  buyer-seller transactions. It protects both parties by holding funds until the
  buyer confirms successful delivery of goods or services, making online
  shopping and marketplace deals safer and more trustworthy.
pricing: Freemium
