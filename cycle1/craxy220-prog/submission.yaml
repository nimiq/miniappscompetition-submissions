builder_story: "TrustPay was inspired by a common problem in online
  transactions: buyers fear paying first, while sellers fear delivering without
  getting paid. I wanted to remove that uncertainty by creating a decentralized
  escrow solution that protects both parties. Built on the Nimiq ecosystem,
  TrustPay makes digital transactions simple, secure, and based on transparency
  instead of blind trust."
