app_name: NimRide NG
category: Marketplaces
tagline: Share rides. Deliver parcels. Across Nigeria
description: NimRide NG lets Nigerians travelling between states share the cost
  of trips that are already happening. book a seat in a car going your way, or
  send a parcel with someone already driving there. Payment is held in escrow
  and released only when the passenger confirms arrival.
