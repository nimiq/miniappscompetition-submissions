builder_story: "My inspiration came 2 years ago when my son got a promotion and
  move from Costa Rica to UK with my 6-year-old grand-daughter. We were happy
  for my son but missed Abby a lot. We do video conferences regularly and they
  keep sending us photos of their trips and events. So, I start creating AI
  scenes and videos to play with her. (i.e.
  https://www.youtube.com/watch?v=rMCo-v3WuxI )\r

  \r

  As you can see in that video, my biggest issue was consistency of characters
  thru different scenes and LLM Models. To improve that I create a complex
  prompt with over 30 fields that i need to adapt manually each time to generate
  a profile character sheet to add as references.\r

  \r

  My first tool was the automation of that prompt so the AI analyze the image
  automatically and filled my prompt so it was easier to change one or two
  fields if needed.\r

  \r

  Now the convergence of mature AI models (ChatGPT Sol, Claude Fable /Sonnet 5,
  and the Image/Video generations models of Google) reached an excellent level
  for me as Business Administrator to do some Vibe-Coding and create this
  Mini-App for Nimiq competition.\r

  \r

  Hope you enjoy it and make your love ones of all ages as happy as my
  grand-daughter, my parents and myself."
